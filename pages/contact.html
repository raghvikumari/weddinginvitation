<section class="contact-section">

    <h2 class="contact-title">Leave Your Wishes ❤️</h2>

    <form id="contactForm" class="contact-form">

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Your Email"
            required
        >

        <textarea
            id="message"
            rows="6"
            placeholder="Write your wishes..."
            required
        ></textarea>

        <button type="submit">
            Send Wishes
        </button>

    </form>

    <p id="status"></p>

</section>
