<section class="save-date-section">

    <div class="scratch-card">

        <!-- Content hidden underneath -->
        <div class="save-date-content">

            <div class="save-date-small">
                Together with their families
            </div>

            <h1 class="save-date-title">
                Save the Date
            </h1>

            <div class="save-date-date">
                31 DECEMBER 2026
            </div>

            <div class="save-date-day">
                THURSDAY
            </div>

            <div class="save-date-names">
                Anusha & Raghvendra
            </div>

        </div>


        <!-- Scratch layer -->
        <canvas id="scratchCanvas"></canvas>


        <!-- Instruction -->
        <div id="scratchInstruction"
             class="scratch-instruction">

            ✨ Scratch to reveal ✨

        </div>


        <!-- Confetti / flowers -->
        <!-- <div id="celebrationContainer">
            <div id="tsparticles"></div>
        </div> -->
        
    </div>
     <div id="countdownContainer" class="countdown-container">

        <div class="countdown-heading">
            Counting down to our special day
        </div>

        <div class="countdown">

            <div class="countdown-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="countdown-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="countdown-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="countdown-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>

    </div>


</section>
